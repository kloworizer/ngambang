[workspace]
resolver = "2"
members = ["crates/core", "crates/platform", "crates/app"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license-file = "LICENSE"
repository = "https://github.com/kloworizer/ngambang"
rust-version = "1.85"

[workspace.dependencies]
ngambang-core = { path = "crates/core" }
ngambang-platform = { path = "crates/platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
lexopt = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
